<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="300" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="500" y="45" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#000000" text-anchor="middle">CineData API - User Flow Diagram</text>

  <!-- Flow Boxes -->
  <!-- Step 1 -->
  <g transform="translate(40, 100)">
    <rect width="130" height="80" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="65" y="35" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">1. Register /</text>
    <text x="65" y="55" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Login</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="170" y1="140" x2="198" y2="140" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g transform="translate(200, 100)">
    <rect width="130" height="80" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="65" y="35" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">2. Obtain JWT</text>
    <text x="65" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000" text-anchor="middle">Session Token</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="330" y1="140" x2="358" y2="140" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g transform="translate(360, 100)">
    <rect width="130" height="80" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="65" y="35" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">3. Generate</text>
    <text x="65" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">API Key</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="490" y1="140" x2="518" y2="140" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g transform="translate(520, 100)">
    <rect width="130" height="80" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="65" y="35" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">4. Try API</text>
    <text x="65" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">Playground</text>
  </g>

  <!-- Arrow 4 -->
  <line x1="650" y1="140" x2="678" y2="140" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <g transform="translate(680, 100)">
    <rect width="130" height="80" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="65" y="35" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">5. Integrate API</text>
    <text x="65" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000" text-anchor="middle">in App</text>
  </g>

  <!-- Arrow 5 -->
  <line x1="810" y1="140" x2="838" y2="140" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6 -->
  <g transform="translate(840, 100)">
    <rect width="120" height="80" rx="6" fill="#000000" stroke="#000000" stroke-width="2"/>
    <text x="60" y="35" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">6. Track</text>
    <text x="60" y="55" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Analytics</text>
  </g>

</svg>
