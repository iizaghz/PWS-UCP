<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="450" y="45" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#000000" text-anchor="middle">CineData API - System Architecture</text>

  <!-- Clients -->
  <g transform="translate(50, 100)">
    <rect width="180" height="120" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="90" y="40" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Developer Web App</text>
    <text x="90" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000" text-anchor="middle">SaaS Dashboard SPA</text>
    <text x="90" y="92" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#000000" text-anchor="middle">Bearer JWT Token</text>
  </g>

  <g transform="translate(50, 280)">
    <rect width="180" height="120" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="90" y="40" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">External App / SDK</text>
    <text x="90" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000" text-anchor="middle">Developer Client</text>
    <text x="90" y="92" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#000000" text-anchor="middle">x-api-key Header</text>
  </g>

  <!-- Express Server Boundary -->
  <rect x="300" y="80" width="320" height="340" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="300" y="80" width="320" height="38" rx="8" fill="#000000"/>
  <text x="460" y="105" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Express.js Backend Server</text>

  <!-- Middleware -->
  <rect x="330" y="140" width="260" height="42" rx="4" fill="#f8fafc" stroke="#000000" stroke-width="1.5"/>
  <text x="460" y="166" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">JWT &amp; API Key Auth Middleware</text>

  <rect x="330" y="200" width="260" height="42" rx="4" fill="#f8fafc" stroke="#000000" stroke-width="1.5"/>
  <text x="460" y="226" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">Rate Limiting &amp; Input Validation</text>

  <rect x="330" y="260" width="260" height="42" rx="4" fill="#f8fafc" stroke="#000000" stroke-width="1.5"/>
  <text x="460" y="286" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">Controllers &amp; Services Layer</text>

  <rect x="330" y="320" width="260" height="42" rx="4" fill="#f8fafc" stroke="#000000" stroke-width="1.5"/>
  <text x="460" y="346" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">Database Connection Pool (pg)</text>

  <!-- Database -->
  <g transform="translate(680, 190)">
    <path d="M 0,20 A 70,20 0 0,0 140,20 L 140,100 A 70,20 0 0,1 0,100 Z" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <ellipse cx="70" cy="20" rx="70" ry="20" fill="#f1f5f9" stroke="#000000" stroke-width="2"/>
    <text x="70" y="25" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">PostgreSQL</text>
    <text x="70" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Supabase Engine</text>
  </g>

  <!-- Connectors -->
  <line x1="230" y1="160" x2="330" y2="160" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 230,340 H 280 V 220 H 330" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="340" x2="680" y2="250" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

</svg>
