<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="450" y="45" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#000000" text-anchor="middle">CineData API - Activity Diagram (Request Lifecycle)</text>

  <!-- Start Node -->
  <circle cx="450" cy="85" r="12" fill="#000000"/>

  <!-- Step 1 -->
  <rect x="330" y="130" width="240" height="42" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="450" y="156" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">Receive HTTP Request + x-api-key</text>
  <line x1="450" y1="97" x2="450" y2="130" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision 1: Key Present? -->
  <polygon points="450,200 540,230 450,260 360,230" fill="#f8fafc" stroke="#000000" stroke-width="2"/>
  <text x="450" y="234" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">Key Header Present?</text>
  <line x1="450" y1="172" x2="450" y2="200" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Error Path: Missing Key -->
  <rect x="620" y="209" width="180" height="42" rx="6" fill="#f1f5f9" stroke="#000000" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="710" y="235" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">401 MISSING_API_KEY</text>
  <line x1="540" y1="230" x2="620" y2="230" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="220" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#000000">No</text>

  <!-- Step 2: Hash & Lookup -->
  <rect x="330" y="290" width="240" height="42" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="450" y="316" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">Compute SHA-256 Hash &amp; Lookup</text>
  <line x1="450" y1="260" x2="450" y2="290" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="278" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#000000">Yes</text>

  <!-- Decision 2: Active & Valid? -->
  <polygon points="450,360 540,390 450,420 360,390" fill="#f8fafc" stroke="#000000" stroke-width="2"/>
  <text x="450" y="394" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">Key Valid &amp; Active?</text>
  <line x1="450" y1="332" x2="450" y2="360" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Error Path: Invalid Key -->
  <rect x="620" y="369" width="180" height="42" rx="6" fill="#f1f5f9" stroke="#000000" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="710" y="395" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">401/403 INVALID_KEY</text>
  <line x1="540" y1="390" x2="620" y2="390" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#000000">No</text>

  <!-- Decision 3: Rate Limit -->
  <polygon points="450,450 540,480 450,510 360,480" fill="#f8fafc" stroke="#000000" stroke-width="2"/>
  <text x="450" y="484" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">Within Rate Limit?</text>
  <line x1="450" y1="420" x2="450" y2="450" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="438" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#000000">Yes</text>

  <!-- Error Path: Rate Exceeded -->
  <rect x="620" y="459" width="180" height="42" rx="6" fill="#f1f5f9" stroke="#000000" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="710" y="485" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">429 RATE_EXCEEDED</text>
  <line x1="540" y1="480" x2="620" y2="480" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="470" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#000000">No</text>

  <!-- Step 3: Execute & Log -->
  <rect x="330" y="550" width="240" height="45" rx="6" fill="#000000" stroke="#000000" stroke-width="2"/>
  <text x="450" y="577" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Query DB, Log Usage &amp; Return JSON</text>
  <line x1="450" y1="510" x2="450" y2="550" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="530" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#000000">Yes</text>

  <!-- End Node -->
  <circle cx="450" cy="640" r="16" fill="none" stroke="#000000" stroke-width="3"/>
  <circle cx="450" cy="640" r="10" fill="#000000"/>
  <line x1="450" y1="595" x2="450" y2="624" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

</svg>
