<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <!-- Background -->
  <rect width="1000" height="700" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  
  <text x="500" y="45" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#000000" text-anchor="middle">CineData API - Entity Relationship Diagram (ERD)</text>

  <!-- Entity: Users -->
  <g transform="translate(50, 80)">
    <rect width="220" height="180" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <rect width="220" height="38" rx="6" fill="#000000"/>
    <text x="110" y="25" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">users</text>
    <text x="15" y="65" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#000000">PK id (SERIAL)</text>
    <text x="15" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000">name (VARCHAR)</text>
    <text x="15" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000">email (VARCHAR UK)</text>
    <text x="15" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000">password_hash</text>
    <text x="15" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000">created_at</text>
  </g>

  <!-- Entity: Api Keys -->
  <g transform="translate(390, 80)">
    <rect width="220" height="200" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <rect width="220" height="38" rx="6" fill="#000000"/>
    <text x="110" y="25" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">api_keys</text>
    <text x="15" y="65" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#000000">PK id (SERIAL)</text>
    <text x="15" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#000000">FK user_id</text>
    <text x="15" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000">name (VARCHAR)</text>
    <text x="15" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000">key_prefix, key_hash</text>
    <text x="15" y="154" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000">environment, is_active</text>
    <text x="15" y="176" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000">expires_at, last_used_at</text>
  </g>

  <!-- Entity: Api Usage -->
  <g transform="translate(730, 80)">
    <rect width="220" height="200" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <rect width="220" height="38" rx="6" fill="#000000"/>
    <text x="110" y="25" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">api_usage</text>
    <text x="15" y="65" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#000000">PK id (SERIAL)</text>
    <text x="15" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#000000">FK api_key_id</text>
    <text x="15" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000">endpoint, method</text>
    <text x="15" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000">status_code, response_time</text>
    <text x="15" y="154" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000">ip_address, user_agent</text>
    <text x="15" y="176" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000">requested_at</text>
  </g>

  <!-- Entity: Movies -->
  <g transform="translate(50, 360)">
    <rect width="220" height="280" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <rect width="220" height="38" rx="6" fill="#000000"/>
    <text x="110" y="25" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">movies</text>
    <text x="15" y="65" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#000000">PK id (SERIAL)</text>
    <text x="15" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000">title, original_title</text>
    <text x="15" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000">slug (UK), overview</text>
    <text x="15" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000">release_date, runtime</text>
    <text x="15" y="154" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000">budget, revenue</text>
    <text x="15" y="176" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000">popularity, vote_average</text>
    <text x="15" y="198" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000">vote_count, status</text>
    <text x="15" y="220" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000">poster_url, backdrop_url</text>
    <text x="15" y="242" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000">created_at, updated_at</text>
  </g>

  <!-- Entity: Genres -->
  <g transform="translate(390, 360)">
    <rect width="220" height="140" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <rect width="220" height="38" rx="6" fill="#000000"/>
    <text x="110" y="25" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">genres</text>
    <text x="15" y="65" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#000000">PK id (SERIAL)</text>
    <text x="15" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000">name (VARCHAR UK)</text>
    <text x="15" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000">slug (VARCHAR UK)</text>
  </g>

  <!-- Entity: Movie Cast -->
  <g transform="translate(730, 360)">
    <rect width="220" height="160" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <rect width="220" height="38" rx="6" fill="#000000"/>
    <text x="110" y="25" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">movie_cast</text>
    <text x="15" y="65" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#000000">PK id (SERIAL)</text>
    <text x="15" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#000000">FK movie_id</text>
    <text x="15" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#000000">FK person_id</text>
    <text x="15" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#000000">character_name, order</text>
  </g>

  <!-- Lines / Connections -->
  <line x1="270" y1="170" x2="390" y2="170" stroke="#000000" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="610" y1="170" x2="730" y2="170" stroke="#000000" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="270" y1="430" x2="390" y2="430" stroke="#000000" stroke-width="2"/>
  <path d="M 270,520 C 330,520 330,530 500,530 C 670,530 670,440 730,440" fill="none" stroke="#000000" stroke-width="2"/>

</svg>
